name: CloudSec Security Gate & Drift Guard
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  cloudsec-attack-surface-scan:
    name: CloudSec Misconfiguration & Exploitability Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover tests/ -v

      - name: Run CloudSec CI Misconfiguration Guard
        run: |
          python -m scanner ci --dir dataset/policies --exit-code-on-high --format json > scan_results.json
        continue-on-error: true

      - name: Upload Security Findings Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudsec-scan-results
          path: scan_results.json
